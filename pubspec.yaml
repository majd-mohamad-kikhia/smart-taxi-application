name: mshoar
description: "Smart Taxi - تطبيق رحلات ذكي"
publish_to: 'none'
version: 3.0.0+7

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Required by the generated AppLocalizations (already resolved
  # transitively through flutter_localizations at this version).
  intl: ^0.20.2

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Dependency Injection
  get_it: ^7.7.0

  # Fonts
  google_fonts: ^6.2.1

  # Networking
  dio: ^5.7.0
  socket_io_client: ^2.0.3+1

  # Location
  geolocator: ^13.0.2

  # Local storage
  shared_preferences: ^2.3.3
  lottie: ^3.6.1
  google_maps_flutter: ^2.18.1
  flutter_dotenv: ^5.2.1
  firebase_core: 4.14.0
  firebase_messaging: 16.6.0
  flutter_local_notifications: ^22.3.1
  flutter_markdown_plus: ^1.0.12
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.2

  # Deep links: office orders opened from their WhatsApp link
  app_links: ^7.0.0
  pdf: ^3.12.0
  share_plus: ^13.3.1
  audioplayers: ^6.7.1
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/loader/taxi_loader_yellow.json
    - .env
    - assets/icons/app_logo_icons/icon-master-1024.png
    - assets/icons/app_logo_icons/icon-splash-android12.png
    - assets/map_styles/dark_map_style.json
    # New-order alert in the driver app (looped for 10 s).
    - assets/sounds/new_order.wav
    # Embedded in the PDF trip bill (Arabic + Latin).
    - assets/fonts/Tajawal-Regular.ttf
    - assets/fonts/Tajawal-Bold.ttf

# ── App launcher icon ──────────────────────────────────────────
# Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_logo_icons/icon-master-1024.png"

# ── Native splash screen (shown before Flutter's first frame) ──
# Regenerate with: dart run flutter_native_splash:create
flutter_native_splash:
  # Matches the logo image's own baked-in background exactly (it has no
  # transparency — every pixel outside the mark is pure black), so the
  # image blends into the splash canvas with no visible seam/rectangle.
  color: "#000000"
  image: "assets/icons/app_logo_icons/icon-master-1024.png"
  android_12:
    # Android 12's SplashScreen API masks/zooms into the center ~66%
    # "safe zone" of whatever icon you give it — the flat, edge-to-edge
    # master logo got its speed-lines and corners cropped off under that
    # mask. This variant pre-pads the logo down to fit inside that zone.
    image: "assets/icons/app_logo_icons/icon-splash-android12.png"
    icon_background_color: "#000000"
  web: false
